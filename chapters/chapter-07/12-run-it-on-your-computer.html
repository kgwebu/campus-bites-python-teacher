  }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},k,ct)}).then(function(p){
    try{sessionStorage.setItem("cb-teacher-pw",pw)}catch(e){}
    document.open();document.write(new TextDecoder().decode(p));document.close();
  });
}
function go(pw,quiet){
  document.getElementById("m").textContent=quiet?"":"Checking…";
  return open_(pw).catch(function(e){
    try{sessionStorage.removeItem("cb-teacher-pw")}catch(x){}
    document.getElementById("m").textContent=quiet?"":(/https/.test(e.message)?e.message:"That password did not work.");
  });
}
