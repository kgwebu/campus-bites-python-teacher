function bytes(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function open_(pw){
  if(!window.crypto||!crypto.subtle) return Promise.reject(new Error("Open this page over https."));
  var d=bytes(B), iv=d.slice(0,12), ct=d.slice(12);
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(m){
